services:
  tempoemails:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://tempoemails.com}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://tempoemails.com}
        PUBLIC_GOOGLE_ANALYTICS_ID: ${PUBLIC_GOOGLE_ANALYTICS_ID:-}
        PUBLIC_GOOGLE_ADSENSE_ID: ${PUBLIC_GOOGLE_ADSENSE_ID:-}
        PUBLIC_GOOGLE_ADSENSE_SLOT_ID: ${PUBLIC_GOOGLE_ADSENSE_SLOT_ID:-}
        PUBLIC_GTM_ID: ${PUBLIC_GTM_ID:-}
        PUBLIC_GOOGLE_SITE_VERIFICATION: ${PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        PUBLIC_BING_SITE_VERIFICATION: ${PUBLIC_BING_SITE_VERIFICATION:-}
    image: tempoemails:latest
    container_name: tempoemails
    restart: unless-stopped
    ports:
      - "${PORT:-3012}:3012"
    env_file:
      - path: prod.env
        required: false
      - path: .env
        required: false
    environment:
      - SITE_URL=${SITE_URL:-https://tempoemails.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3012/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
