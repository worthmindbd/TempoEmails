services:
  tempoemails:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://tempoemails.dev}
    image: tempoemails:latest
    container_name: tempoemails
    restart: unless-stopped
    ports:
      - "${PORT:-3012}:3012"
    environment:
      - SITE_URL=${SITE_URL:-https://tempoemails.dev}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3012/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
